# =====================================================================
# producer-service · configuración
#
# Formato ${VARIABLE:valor_por_defecto}
#   - Si existe la variable de entorno VARIABLE, se usa su valor.
#   - Si no existe, se usa el valor por defecto (pensado para tu PC).
# Así el MISMO código funciona en tu PC, en Docker Compose y en AWS:
# solo cambian las variables de entorno.
# =====================================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: producer-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ---------------- Base de datos (producerdb) ----------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:producerdb}
    username: ${DB_USER:producer_user}
    password: ${DB_PASSWORD:producer_local_123}

  jpa:
    hibernate:
      # Flyway es el ÚNICO que crea o cambia tablas. Hibernate no toca el esquema.
      ddl-auto: none
    # Cierra la conexión a la BD al terminar el servicio, no al terminar la respuesta HTTP
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---------------- Kafka ----------------
  kafka:
    # Desde tu PC: localhost:9094 (puerta EXTERNAL de la Fase 1)
    # Desde Docker Compose: kafka:9092 · En AWS: kafka.uceshop.local:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # El broker confirma solo cuando el mensaje quedó guardado
      acks: all
      properties:
        # Evita mensajes duplicados si el productor reintenta
        enable.idempotence: true
        # Si Kafka no responde, se da por fallido en ~10 s (en vez de 1-2 minutos)
        max.block.ms: 10000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        # No agrega el nombre de la clase Java en las cabeceras del mensaje:
        # el consumer-service (otro proyecto) no conoce nuestras clases
        spring.json.add.type.headers: false

# ---------------- Configuración propia de la aplicación ----------------
app:
  kafka:
    topics:
      orders:
        name: ${KAFKA_TOPIC_ORDERS:orders}
        partitions: 3
        replicas: 1
    # Segundos máximos que el servicio espera la confirmación de Kafka
    send-timeout-seconds: 15

# ---------------- Actuator / métricas ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
        
  metrics:
    tags:
      # Etiqueta para distinguir este servicio en Prometheus/Grafana
      application: ${spring.application.name}

