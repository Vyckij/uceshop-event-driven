# =====================================================================
# UCEShop · Caso Práctico 2 · Stack local completo
#   Infraestructura (Fase 1): Kafka (KRaft) · RabbitMQ · producerdb · consumerdb
#   Aplicaciones   (Fase 5): producer-service · consumer-service
#   Observabilidad (Fase 6): kafka-exporter · Prometheus · Grafana
#
# Uso:
#   1) cp .env.example .env          (solo la primera vez)
#   2) docker compose up -d --build  (construye las imágenes y levanta todo)
#   3) docker compose ps             (todo debe decir "healthy")
# =====================================================================

# Versión del formato pedida por el enunciado.
# Docker Compose v2 la ignora y muestra un aviso "obsolete": es normal.
version: "3.9"

services:

  # -------------------------------------------------------------------
  # KAFKA · un solo nodo en modo KRaft (sin ZooKeeper)
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG}
    container_name: uceshop-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - uceshop-net

  # -------------------------------------------------------------------
  # RABBITMQ · con consola web de administración
  # -------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:${RABBITMQ_IMAGE_TAG}
    container_name: uceshop-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # FASE 6: activa los plugins de consola web y de métricas para Prometheus (puerto 15692)
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - uceshop-net

  # -------------------------------------------------------------------
  # POSTGRESQL · base de datos del producer-service
  # -------------------------------------------------------------------
  producer-db:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: uceshop-producer-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRODUCER_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${PRODUCER_DB_NAME}
      POSTGRES_USER: ${PRODUCER_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCER_DB_PASSWORD}
    volumes:
      - producer-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCER_DB_USER} -d ${PRODUCER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - uceshop-net

  # -------------------------------------------------------------------
  # POSTGRESQL · base de datos del consumer-service
  # -------------------------------------------------------------------
  consumer-db:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: uceshop-consumer-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSUMER_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${CONSUMER_DB_NAME}
      POSTGRES_USER: ${CONSUMER_DB_USER}
      POSTGRES_PASSWORD: ${CONSUMER_DB_PASSWORD}
    volumes:
      - consumer-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONSUMER_DB_USER} -d ${CONSUMER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - uceshop-net

  # ===================================================================
  # FASE 5 · PRODUCER-SERVICE
  # ===================================================================
  producer-service:
    build:
      context: ./producer-service           # carpeta con el Dockerfile
    image: uceshop/producer-service:${APP_VERSION}
    container_name: uceshop-producer-service
    restart: unless-stopped
    depends_on:                              # no arranca hasta que estos estén "healthy"
      producer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRODUCER_SERVICE_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      # Dentro de la red se usa el NOMBRE del servicio y el puerto INTERNO
      DB_HOST: producer-db
      DB_PORT: 5432
      DB_NAME: ${PRODUCER_DB_NAME}
      DB_USER: ${PRODUCER_DB_USER}
      DB_PASSWORD: ${PRODUCER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092    # puerta INTERNAL de Kafka
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s                   # tiempo para el apagado ordenado
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - uceshop-net

  # ===================================================================
  # FASE 5 · CONSUMER-SERVICE
  # ===================================================================
  consumer-service:
    build:
      context: ./consumer-service
    image: uceshop/consumer-service:${APP_VERSION}
    container_name: uceshop-consumer-service
    restart: unless-stopped
    depends_on:
      consumer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONSUMER_SERVICE_PORT}:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: consumer-db
      DB_PORT: 5432
      DB_NAME: ${CONSUMER_DB_NAME}
      DB_USER: ${CONSUMER_DB_USER}
      DB_PASSWORD: ${CONSUMER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/liveness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - uceshop-net

  # ===================================================================
  # FASE 6 · KAFKA EXPORTER (métricas de tópicos, particiones y lag)
  # ===================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_IMAGE_TAG}
    container_name: uceshop-kafka-exporter
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:9092"          # puerta INTERNAL de Kafka
      - "--kafka.version=3.9.0"              # versión de protocolo compatible con Kafka 4.x
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9308/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - uceshop-net

  # ===================================================================
  # FASE 6 · PROMETHEUS (recolecta y guarda las métricas)
  # ===================================================================
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG}
    container_name: uceshop-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"   # guarda 7 días de métricas
      - "--web.enable-lifecycle"             # permite recargar la config sin reiniciar
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - uceshop-net

  # ===================================================================
  # FASE 6 · GRAFANA (dashboards)
  # ===================================================================
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG}
    container_name: uceshop-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Al abrir Grafana se muestra directamente el dashboard de UCEShop
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/uceshop-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - uceshop-net
# ===================================================================
# DASHBOARD WEB (Nginx: archivos estáticos + proxy hacia las APIs)
# ===================================================================
  dashboard:
    build:
      context: ./uceshop-dashboard
    image: uceshop/dashboard:${APP_VERSION}
    container_name: uceshop-dashboard
    restart: unless-stopped
    depends_on:
      producer-service:
        condition: service_started
      consumer-service:
        condition: service_started
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:${DASHBOARD_PORT}:8080"
    environment:
      PRODUCER_UPSTREAM: producer-service:8080
      CONSUMER_UPSTREAM: consumer-service:8081
      PROMETHEUS_UPSTREAM: prometheus:9090
      NGINX_RESOLVER: 127.0.0.11             # DNS interno de Docker
      CORS_ALLOW_ORIGIN: ""                  # vacío = sin CORS (no hace falta en local)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uceshop-net


# ---------------------------------------------------------------------
# RED personalizada: todos los contenedores se ven por su nombre
# ---------------------------------------------------------------------
networks:
  uceshop-net:
    name: uceshop-net
    driver: bridge

# ---------------------------------------------------------------------
# VOLÚMENES con nombre: los datos sobreviven a "docker compose down"
# (se borran solo con "docker compose down -v")
# ---------------------------------------------------------------------
volumes:
  kafka-data:
  rabbitmq-data:
  producer-db-data:
  consumer-db-data:
  prometheus-data:
  grafana-data: