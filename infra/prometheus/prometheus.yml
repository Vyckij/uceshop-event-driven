# =====================================================================
# UCEShop · Prometheus (entorno local con Docker Compose)
#
# Prometheus "raspa" (scrape) cada 15 s el endpoint de métricas de cada
# objetivo y guarda los valores. Grafana luego los consulta.
#
# Los nombres de host son los nombres de servicio del docker-compose.yml
# (dentro de la red uceshop-net).
# =====================================================================

global:
  scrape_interval: 15s       # cada cuánto se leen las métricas
  scrape_timeout: 10s        # tiempo máximo de cada lectura
  evaluation_interval: 15s
  external_labels:
    project: uceshop
    environment: local

scrape_configs:

  # Prometheus se monitorea a sí mismo
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # producer-service: métricas de Spring Boot Actuator + Micrometer
  - job_name: producer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["producer-service:8080"]

  # consumer-service: métricas de Spring Boot Actuator + Micrometer
  - job_name: consumer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["consumer-service:8081"]

  # Kafka: tópicos, offsets por partición y lag del consumer group (kafka-exporter)
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # RabbitMQ: plugin rabbitmq_prometheus. /metrics/per-object da métricas POR COLA
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]